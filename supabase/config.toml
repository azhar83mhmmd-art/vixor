# Dipakai oleh `supabase functions deploy`. push-send dipanggil pg_net tanpa JWT (diamankan header x-push-secret),
# jadi verifikasi JWT HARUS mati. Dengan file ini, flag --no-verify-jwt tidak lagi wajib diingat.
[functions.push-send]
verify_jwt = false

[functions.register]
verify_jwt = false

[functions.purge-expired]
verify_jwt = false
